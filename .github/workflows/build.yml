name: Watch RSD Windows validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/validate-watch-rsd']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install strawberryperl make --no-progress
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --no-bundle --config src-tauri/ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: iloader-watch-rsd-windows
          path: src-tauri/target/release/iloader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: src-tauri/Cargo.lock
